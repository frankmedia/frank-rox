// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Disable androidTest tasks ONLY for capgo-capacitor-health to avoid minSdk conflicts
subprojects { subproject ->
    if (subproject.name == "capgo-capacitor-health") {
        subproject.afterEvaluate {
            // Disable ALL androidTest-related tasks for this plugin
            tasks.matching { task ->
                def n = task.name
                n.contains("AndroidTest") || n.contains("androidTest")
            }.configureEach { task ->
                task.enabled = false
                println "⚠️  Disabled ${task.path}"
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
